<style>
/* Layout: uma coluna de celular (máx. 480px), telas trocadas como num app; a "ficha de atendimento" é o cartão central. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --ink: #15211f;
  --muted: #56645f;
  --line: #d3ddd8;
  --primary: #0f5f58;
  --primary-ink: #ffffff;
  --mark: #f4c04a;
  --mark-ink: #3a2a00;
  --ok: #1f7a4d;
  --ok-bg: #e2f3ea;
  --bad: #b53a26;
  --bad-bg: #fbe7e2;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1614; --surface: #15211e; --ink: #e6efeb; --muted: #9db0a9; --line: #2a3a36;
    --primary: #4fb8ad; --primary-ink: #06201d; --mark: #f4c04a; --mark-ink: #2b1f00;
    --ok: #5fd39a; --ok-bg: #12301f; --bad: #ff8a73; --bad-bg: #3a1a14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1614; --surface: #15211e; --ink: #e6efeb; --muted: #9db0a9; --line: #2a3a36;
  --primary: #4fb8ad; --primary-ink: #06201d; --mark: #f4c04a; --mark-ink: #2b1f00;
  --ok: #5fd39a; --ok-bg: #12301f; --bad: #ff8a73; --bad-bg: #3a1a14; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 480px; margin: 0 auto; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* topo com nível e XP */
.top { display: flex; align-items: center; gap: 12px; }
.psi { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 26px; flex: none; }
.top .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.top .lvl { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .5s ease; }
.streak { display: flex; flex-direction: column; align-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.streak .folgas { font-size: 10px; margin-top: 2px; white-space: nowrap; }
.revbanner { text-align: left; border: 2px solid var(--primary); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.revbanner > span:first-child { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.revbanner strong { font-family: var(--font-display); font-size: 19px; line-height: 1.15; }
.revbanner .sub { font-size: 14px; color: var(--muted); }
.revbanner .go { font-family: var(--font-display); font-weight: 800; background: var(--primary); color: var(--primary-ink); padding: 10px 14px; border-radius: 10px; }
.foot.left { text-align: left; margin-top: -4px; }
.streak b { font-family: var(--font-display); font-size: 22px; color: var(--ink); line-height: 1; }

/* home */
.hero { display: flex; flex-direction: column; gap: 8px; padding-block: 8px; }
.hero h1 { font-size: clamp(34px, 9vw, 46px); font-weight: 800; letter-spacing: -.02em; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 58%, var(--mark) 58%); color: inherit; }
.hero p { color: var(--muted); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.mode strong { font-family: var(--font-display); font-size: 17px; }
.mode span { color: var(--muted); font-size: 14px; }
.mode.hot { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.mode.hot span { color: inherit; opacity: .85; }
.mode[disabled] { opacity: .5; cursor: not-allowed; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; }
.section-h h2 { font-size: 20px; }
.chapters { display: flex; flex-direction: column; gap: 8px; }
.chap { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; }
.chap .n { font-family: var(--font-mono); font-size: 13px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--bg); color: var(--muted); }
.chap .t { min-width: 0; }
.chap .t strong { display: block; font-family: var(--font-display); font-size: 16px; }
.chap .t span { font-size: 13px; color: var(--muted); }
.chap[disabled] { opacity: .55; cursor: not-allowed; }
.chap.done .n { background: var(--primary); color: var(--primary-ink); }
.stars { display: flex; gap: 2px; }
.star { width: 16px; height: 16px; fill: var(--line); }
.star.on { fill: var(--mark); }

/* ficha de caso */
.bar-row { display: flex; align-items: center; gap: 12px; }
.back { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 14px; }
.bar-row .bar { flex: 1; }
.ficha { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ficha header { display: flex; justify-content: space-between; gap: 8px; padding: 10px 16px; border-bottom: 1px dashed var(--line); }
.ficha .body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.ficha h2 { font-size: 22px; }
.ficha .q { font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; transition: transform .1s ease; }
.opt:active { transform: scale(.98); }
.opt .k { font-family: var(--font-mono); font-size: 13px; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .k { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.opt[disabled] { cursor: default; }
.opt.dim { opacity: .5; }
.fb { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); background: var(--surface); }
.fb.ok { border-color: var(--ok); }
.fb.no { border-color: var(--bad); }
.fb h3 { font-size: 18px; }
.fb.ok h3 { color: var(--ok); }
.fb.no h3 { color: var(--bad); }
.ref { align-self: flex-start; font-family: var(--font-mono); font-size: 12px; background: var(--mark); color: var(--mark-ink); padding: 3px 8px; border-radius: 6px; }
.cta { border: 0; background: var(--primary); color: var(--primary-ink); border-radius: 12px; padding: 14px; font-family: var(--font-display); font-weight: 700; font-size: 17px; width: 100%; }
.cta.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.xp-pop { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }

/* resultado */
.result { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; padding-block: 16px; }
.result .big { font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1; }
.result .stars .star { width: 40px; height: 40px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { font-size: 13px; border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 99px; }
.chip.new { border-color: var(--mark); background: var(--mark); color: var(--mark-ink); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 10px; width: 100%; }

/* relâmpago */
.quick-head { display: flex; justify-content: space-between; align-items: center; }
.timer { font-family: var(--font-display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.combo { font-family: var(--font-mono); font-size: 13px; background: var(--mark); color: var(--mark-ink); padding: 4px 10px; border-radius: 99px; }
.statement { min-height: 190px; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.25; transition: background .2s, border-color .2s; }
.statement.ok { background: var(--ok-bg); border-color: var(--ok); }
.statement.no { background: var(--bad-bg); border-color: var(--bad); }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.yn button { border: 0; border-radius: 14px; padding: 18px 10px; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.yn .no { background: var(--bad); color: var(--surface); }
.yn .yes { background: var(--ok); color: var(--surface); }
.hint { font-size: 14px; color: var(--muted); text-align: center; min-height: 42px; }

/* biblioteca e conquistas */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.card { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card .ref { font-size: 11px; }
.card p { font-size: 14px; }
.card.locked { background: transparent; border-style: dashed; color: var(--muted); }
.card.locked .ref { background: var(--line); color: var(--muted); }
.badge-ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--line); font-family: var(--font-display); font-weight: 800; color: var(--muted); }
.card.got .badge-ico { background: var(--mark); color: var(--mark-ink); }
.card strong { font-family: var(--font-display); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; opacity: 0; transition: .3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 20; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.foot { font-size: 13px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: scale(1); opacity: 1; } }
/* hoje: desafio e missões */
.desafio { text-align: left; border: 0; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.desafio > span:first-child { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.desafio .label { color: inherit; opacity: .75; }
.desafio strong { font-family: var(--font-display); font-size: 21px; line-height: 1.15; }
.desafio .sub { font-size: 14px; opacity: .8; }
.desafio .go { font-family: var(--font-display); font-weight: 800; background: var(--mark); color: var(--mark-ink); padding: 10px 16px; border-radius: 10px; }
.sq { display: flex; gap: 4px; }
.sq i { width: 18px; height: 18px; border-radius: 4px; background: var(--ok); }
.sq i.x { background: var(--bad); }
.big-sq i { width: 36px; height: 36px; border-radius: 8px; }
.missoes { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.missoes h3 { font-size: 17px; }
.missao { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; font-size: 15px; }
.missao .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--surface); }
.missao.ok .ck { background: var(--ok); border-color: var(--ok); }
.missao .mt-wrap { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.missao.ok .mt { text-decoration: line-through; color: var(--muted); }
.missao .bar { height: 5px; }
.missao .xp { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.sup { border: 1px dashed var(--primary); background: transparent; color: var(--primary); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px; }
.opt.cut > span:last-child { text-decoration: line-through; }
.combo.seq { align-self: flex-start; }
.result .big small { font-size: 28px; color: var(--muted); }
.fb strong { font-weight: 700; }
/* ranking */
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rank li { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.rank li.vazio { display: block; color: var(--muted); text-align: center; }
.rank li.me { border: 2px solid var(--primary); }
.rank .pos { font-family: var(--font-display); font-weight: 800; font-size: 18px; text-align: center; }
.rank .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.rank .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.rank .pts { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.enter { animation: pop .25s ease; }
</style>

<script>
/* =====================================================================
   BANCO DE PERGUNTAS
   Para adicionar suas perguntas, copie um bloco e mude os textos.
   - "certa" é o índice da alternativa correta (0 = primeira).
   - "ref" vira uma carta colecionável na Biblioteca do Código.
   Fonte principal: Código de Ética Profissional do Psicólogo
   (Resolução CFP nº 010/2005) e resoluções do CFP indicadas.
   ===================================================================== */

/* Trilha de Estudo: perguntas diretas. q(pergunta, alternativas, letra certa, explicação, carta) */
const q = (caso, opcoes, letra, porque, ref) => ({ caso, opcoes, certa: "abcd".indexOf(letra), porque, ref });
const ESTUDO = [
  { id: "conselhos", nome: "Sistema Conselhos", desc: "Quem orienta e fiscaliza a profissão", casos: [
    q("O Sistema Conselhos é formado por quais órgãos?", ["Associação Brasileira de Psicólogos e Sociedade de Psicologia", "Conselho Federal de Psicologia e Conselhos Regionais de Psicologia", "Conselho de Ética e Comissão de Fiscalização", "Sindicato dos Psicólogos e Associação de Classe"], "b",
      "O Sistema Conselhos é o CFP mais os CRPs. Associações e sindicatos são importantes, mas não fazem parte dele.", "Lei 5.766/1971"),
    q("Qual órgão possui jurisdição nacional e sede no Distrito Federal?", ["Conselho Regional de Psicologia", "Associação Brasileira de Psicólogos", "Conselho Federal de Psicologia", "Comissão de Orientação e Fiscalização"], "c",
      "O CFP tem sede em Brasília e atua em todo o país. Cada CRP atua na sua região.", "Lei 5.766/1971"),
    q("Quais são atribuições do Sistema Conselhos?", ["Pesquisar, ensinar e avaliar", "Orientar, disciplinar e fiscalizar o exercício da profissão", "Punir, multar e cassar", "Legislar, julgar e executar"], "b",
      "A missão é orientar, disciplinar e fiscalizar. Punir é só uma parte do disciplinar, e quem legisla é o Congresso.", "Lei 5.766/1971"),
    q("É atribuição do Conselho Federal de Psicologia:", ["Julgar em instância inicial", "Elaborar e aprovar o Código de Ética Profissional do Psicólogo", "Eleger delegados-eleitores", "Publicar a relação de psicólogos de uma região"], "b",
      "O CFP elabora e aprova o Código de Ética. O julgamento em primeira instância e a relação de psicólogos da região ficam com os CRPs.", "Lei 5.766/1971"),
    q("É atribuição dos Conselhos Regionais de Psicologia:", ["Zelar pela observância do Código de Ética na região", "Aprovar o regimento do Conselho Federal", "Legislar sobre a profissão", "Definir a jurisdição nacional"], "a",
      "Os CRPs fazem cumprir o Código na sua região: orientam, fiscalizam e julgam em primeira instância.", "Lei 5.766/1971"),
    q("O Código de Ética Profissional do Psicólogo serve como:", ["Instrumento-guia para a conduta profissional", "Manual de publicidade", "Tabela de honorários", "Lista de especialidades"], "a",
      "O Código é um guia de conduta construído pela categoria. Ele orienta a reflexão ética e não serve só para punir.", "Res. CFP 010/2005"),
    q("Qual é a função do Sistema Conselhos em relação à ética?", ["Apenas punir profissionais", "Construir parâmetros éticos, difundi-los e zelar pelo exercício profissional qualificado", "Defender interesses financeiros da categoria", "Criar leis para o Congresso Nacional"], "b",
      "O Sistema constrói e divulga parâmetros éticos e zela pela qualidade do serviço prestado à sociedade. Defender interesses financeiros é papel do sindicato.", "Res. CFP 010/2005"),
  ]},
  { id: "bioetica", nome: "Bioética e direitos humanos", desc: "Os valores por trás do Código", casos: [
    q("A Declaração Universal dos Direitos Humanos destaca quais valores?", ["Lucro e competição", "Liberdade, igualdade e dignidade", "Sigilo e publicidade", "Tortura e punição"], "b",
      "A DUDH (1948) afirma liberdade, igualdade e dignidade de todas as pessoas. O Código de Ética se baseia nesses valores.", "DUDH (1948)"),
    q("Qual princípio bioético significa visar o benefício do paciente?", ["Autonomia", "Não maleficência", "Beneficência", "Justiça"], "c",
      "Beneficência é fazer o bem. Não maleficência é não causar dano. Autonomia é respeitar a decisão da pessoa. Justiça é a distribuição justa do cuidado.", "Princípios da bioética"),
    q("O que significa não maleficência na bioética?", ["Respeitar a autonomia do indivíduo", "Visar o benefício do paciente", "Não causar dano intencional ao paciente ou à cobaia", "Submeter a autoridade médica à justiça"], "c",
      "Não maleficência é o primum non nocere: antes de tudo, não causar dano.", "Princípios da bioética"),
    q("Quais são exemplos de práticas bioéticas na Psicologia?", ["Sigilo, consentimento informado e supervisão ética", "Publicidade, lucro e autopromoção", "Interrogatório sob hipnose e coerção", "Divulgação de dados de pacientes ao público"], "a",
      "Sigilo protege a intimidade, o consentimento informado respeita a autonomia e a supervisão reduz o risco de dano.", "Princípios da bioética"),
    q("A atuação da Psicologia na defesa dos Direitos Humanos deve focar em:", ["Atender apenas em consultórios particulares", "Promover igualdade, combater discriminação e reduzir desigualdades sociais", "Priorizar lucro e concorrência", "Evitar temas como racismo e violência de gênero"], "b",

/* rodízio da resposta certa: nunca repete a letra da pergunta anterior e passa por A, B, C e D de forma equilibrada */
let sacoCerta = [], ultimaCerta = -1;
function posicaoCerta(n) {
  let disp = sacoCerta.filter(i => i < n && i !== ultimaCerta);
  if (!disp.length) { sacoCerta = embaralhar([0, 1, 2, 3]); disp = sacoCerta.filter(i => i < n && i !== ultimaCerta); }
  const p = disp[0];
  sacoCerta.splice(sacoCerta.indexOf(p), 1);
  ultimaCerta = p;
  return p;
}

const difDias = (a, b) => Math.round((paraData(b) - paraData(a)) / 864e5);
const formatarDia = dia => dia.slice(8, 10) + "/" + dia.slice(5, 7);
const diaMes = () => { const d = new Date(); return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0"); };
function semente(str) {
  let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
}
function sortear(arr, n, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); }

/* avisos em fila, para conquistas e missões não se atropelarem */
const filaToast = []; let toastAtivo = false;
function toast(msg) { filaToast.push(msg); if (!toastAtivo) proximoToast(); }
function proximoToast() {
  const t = document.getElementById("toast"), msg = filaToast.shift();
  if (!msg) { toastAtivo = false; return; }
  toastAtivo = true; t.textContent = msg; t.classList.add("show");
  setTimeout(() => { t.classList.remove("show"); setTimeout(proximoToast, 300); }, 2200);
}

function ganharXP(n) {
  const antes = nivel(); S.xp += n; const depois = nivel();
  if (depois > antes) toast("Subiu de nível: " + NIVEIS[depois].nome);
}
function conquistar(id) {
  if (S.conquistas[id]) return;
  S.conquistas[id] = true; toast("Conquista: " + CONQUISTAS.find(x => x.id === id).nome);
}
function marcarDia() {
  const st = S.streak;
  if (st.dia === hoje()) return;
  const faltas = st.dia ? difDias(st.dia, hoje()) - 1 : Infinity;
  if (faltas === 0) st.n++;
  else if (faltas <= S.folgas) {
    S.folgas -= faltas; st.n++;
    toast(`${faltas === 1 ? "Dia de folga usado" : faltas + " dias de folga usados"}. Sua sequência de ${st.n} dias continua.`);
    conquistar("folga");
  } else st.n = 1;
  st.dia = hoje();
  if (S.streak.n >= 3) conquistar("streak3");
  if (S.streak.n >= 7) conquistar("streak7");
}
const streakAtual = () => S.streak.dia && difDias(S.streak.dia, hoje()) - 1 <= S.folgas ? S.streak.n : 0;

const pendentes = () => Object.keys(S.srs).filter(id => S.srs[id].quando <= hoje() && casoPorId(id));
const proximaRevisao = () => Object.values(S.srs).map(r => r.quando).filter(q => q > hoje()).sort()[0];
function errou(id) { S.srs[id] = { n: 0, quando: hoje() }; }
/* devolve a data da próxima revisão, "dominada", ou null se a questão não estava para revisar hoje */
function acertou(id) {
  const r = S.srs[id];
  if (!r || r.quando > hoje()) return null;
  r.n++;
  if (r.n > INTERVALOS.length) {
    delete S.srs[id]; S.dominadas++;
    if (S.dominadas >= 10) conquistar("dominio");
    return "dominada";
  }
  r.quando = somarDias(hoje(), INTERVALOS[r.n - 1]);
  return r.quando;
}

function missoesHoje() {
  if (!S.missoes || S.missoes.dia !== hoje()) {
    const pool = Object.keys(MISSOES).filter(k => k !== "revisao" || pendentes().length >= 2);
    S.missoes = { dia: hoje(), ids: sortear(pool, 3, semente("m" + hoje())), prog: {}, feitas: {}, todas: false };
    salvar();
  }
  return S.missoes;
}
function evento(tipo, n = 1) {
  const m = missoesHoje();
  if (!m.ids.includes(tipo) || m.feitas[tipo]) return;
  m.prog[tipo] = (m.prog[tipo] || 0) + n;
  if (m.prog[tipo] >= MISSOES[tipo].meta) {
    m.feitas[tipo] = true; ganharXP(MISSOES[tipo].xp);
    toast("Missão cumprida: +" + MISSOES[tipo].xp + " XP");
    if (!m.todas && m.ids.every(k => m.feitas[k])) {
      m.todas = true; ganharXP(BONUS_MISSOES); toast("Todas as missões de hoje: +" + BONUS_MISSOES + " XP"); conquistar("missoes");
      if (S.folgas < MAX_FOLGAS) { S.folgas++; toast("Você ganhou 1 dia de folga para proteger sua sequência"); }
    }
  }
  salvar();
}

const estrelas = (n, cls = "") => `<span class="stars ${cls}" aria-label="${n} de 3 estrelas">${[0,1,2].map(i => `<svg class="star ${i < n ? "on" : ""}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>`).join("")}</span>`;
const quadrados = res => `<span class="sq" aria-label="${res.filter(Boolean).length} de ${res.length} certas">${res.map(r => `<i class="${r ? "" : "x"}"></i>`).join("")}</span>`;

function topo() {
  const n = nivel(), atual = NIVEIS[n], prox = NIVEIS[n + 1];
  const pct = prox ? Math.round((S.xp - atual.xp) / (prox.xp - atual.xp) * 100) : 100;
  return `<div class="top">
    <div class="psi" aria-hidden="true">Ψ</div>
    <div class="who"><span class="label">Nível ${n + 1} · ${S.xp} XP${prox ? " · faltam " + (prox.xp - S.xp) : ""}</span>
      <span class="lvl">${atual.nome}</span><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
    <div class="streak" title="Dias seguidos estudando. Cada folga cobre um dia sem jogar."><b>${streakAtual()}</b>dias<span class="folgas">${S.folgas} folga${S.folgas === 1 ? "" : "s"}</span></div>
  </div>`;
}

/* ===================== telas ===================== */

  ${due ? `<button class="revbanner" id="m-rev2">

    <span class="sub">Rever no dia certo fixa na memória. Cada acerto adia a próxima revisão: 1, 3 e 7 dias.</span></span>
    <span class="go">Revisar</span></button>` : ""}
  <section class="missoes" aria-label="Missões de hoje">
    <div class="section-h"><h3>Missões de hoje</h3><span class="label">${m.ids.filter(k => m.feitas[k]).length}/3</span></div>
    <p class="foot left">Complete as 3: +${BONUS_MISSOES} XP${S.folgas < MAX_FOLGAS ? " e 1 dia de folga" : ""}.</p>
    ${m.ids.map(k => { const d = MISSOES[k], p = Math.min(m.prog[k] || 0, d.meta), ok = m.feitas[k];
      return `<div class="missao ${ok ? "ok" : ""}"><span class="ck" aria-hidden="true">${ok ? "✓" : ""}</span>
        <span class="mt-wrap"><span class="mt">${esc(d.txt)}</span>${d.meta > 1 && !ok ? `<span class="bar"><i style="width:${p / d.meta * 100}%"></i></span>` : ""}</span>
        <span class="xp">${ok ? "feita" : (d.meta > 1 ? p + "/" + d.meta + " · " : "") + "+" + d.xp}</span></div>`; }).join("")}
  </section>
  <div class="modes">
    <button class="mode hot" id="m-rel"><strong>Relâmpago</strong><span>60 segundos: pode ou não pode? Recorde: ${S.melhorRel}</span></button>
    <button class="mode" id="m-pro"><strong>Simulado</strong><span>10 questões, nota no fim.${S.melhorProva != null ? " Melhor nota: " + S.melhorProva : ""}</span></button>
    <button class="mode" id="m-rev" ${due ? "" : "disabled"}><strong>Revisão</strong><span>${due ? due + " para hoje" : prox ? "Próxima em " + formatarDia(prox) : "Nada para revisar"}${S.dominadas ? " · " + S.dominadas + " dominadas" : ""}</span></button>
    <button class="mode" id="m-bib"><strong>Biblioteca</strong><span>${nCartas}/${refs.length} cartas do Código</span></button>
    <button class="mode" id="m-con"><strong>Conquistas</strong><span>${Object.keys(S.conquistas).length}/${CONQUISTAS.length} medalhas</span></button>
    <button class="mode" id="m-rank" ${DB ? "" : "disabled"}><strong>Ranking</strong><span>${DB ? "Veja quem está na frente" : window.claude ? "Disponível para quem entra com conta Claude" : "Disponível na versão do Claude"}</span></button>
  </div>
  ${TRILHAS.map(t => {
    const caps = CAPITULOS.map((c, i) => [c, i]).filter(([c]) => c.trilha === t.id);
    return `<div class="section-h"><h2>${t.nome}</h2><span class="label">${caps.filter(([c]) => S.caps[c.id]).length}/${caps.length} concluídos</span></div>

  <button class="cta ghost" id="share">Copiar meu progresso para compartilhar</button>

const revisar = () => { const ids = pendentes(); if (ids.length) jogar({ modo: "revisao", nome: "Revisão", casos: embaralhar(ids).map(casoPorId) }); };

let partida = null;
function jogar(p) {
  tela = "jogo";
  partida = { ...p, i: 0, acertos: 0, novas: [], xp: 0, seq: 0, res: [], erradas: [], ajuda: p.modo === "capitulo" || p.modo === "revisao" ? 1 : 0, comAjuda: false };
  marcarDia(); salvar(); caso();
}

function caso() {
  const p = partida, c = p.casos[p.i], prova = p.modo === "prova";
  const ordem = embaralhar(c.opcoes.map((t, i) => i).filter(i => i !== c.certa));
  ordem.splice(posicaoCerta(c.opcoes.length), 0, c.certa);
  $app.innerHTML = `<div class="bar-row"><button class="back" id="sair">Sair</button>
    <div class="bar"><i style="width:${p.i / p.casos.length * 100}%"></i></div><span class="label">${p.i + 1}/${p.casos.length}</span></div>
  ${p.seq >= 2 ? `<span class="combo seq">${p.seq} seguidas${p.seq >= 3 ? " · +5 XP de bônus" : ""}</span>` : ""}
  <article class="ficha enter">
    <header><span class="label">${c.titulo ? "Ficha de atendimento" : "Questão"}</span><span class="label">${esc(p.nome)}</span></header>
    <div class="body">${c.titulo ? `<h2>${esc(c.titulo)}</h2><p>${esc(c.caso)}</p><p class="q">O que você faz?</p>` : `<h2>${esc(c.caso)}</h2>`}</div>
  </article>
  <div class="opts">${ordem.map((oi, k) => `<button class="opt" data-o="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(c.opcoes[oi])}</span></button>`).join("")}</div>
  ${p.ajuda ? `<button class="sup" id="sup">Pedir supervisão: elimina 2 alternativas (1 por rodada, acerto vale 10 XP)</button>` : ""}
  ${prova ? `<p class="foot">Simulado: a correção aparece só no fim.</p>` : ""}
  <div id="fb"></div>`;
  document.getElementById("sair").onclick = home;
  $app.querySelectorAll(".opt").forEach(b => b.onclick = () => responder(+b.dataset.o, b));
  const sup = document.getElementById("sup");
  if (sup) sup.onclick = () => {
    p.ajuda = 0; p.comAjuda = true; sup.remove();
    const erradas = embaralhar([...$app.querySelectorAll(".opt")].filter(b => +b.dataset.o !== c.certa)).slice(0, 2);
    erradas.forEach(b => { b.disabled = true; b.classList.add("dim", "cut"); });
  };
}

function responder(o, btn) {
  const p = partida, c = p.casos[p.i], certo = o === c.certa;
  p.res.push(certo);
  let agenda = null;
  if (certo) { p.acertos++; agenda = acertou(c.id); }
  else errou(c.id);
  if (p.modo === "prova") {
    if (!certo) p.erradas.push({ c, o });
    salvar();
    if (p.i === p.casos.length - 1) fimProva(); else { p.i++; caso(); window.scrollTo(0, 0); }
    return;
  }
  const sup = document.getElementById("sup"); if (sup) sup.remove();
  $app.querySelectorAll(".opt").forEach(b => {
    b.disabled = true; const v = +b.dataset.o;
    if (v === c.certa) b.classList.add("right"); else if (b === btn) b.classList.add("wrong"); else b.classList.add("dim");
  });
  let ganho = certo ? (p.comAjuda ? 10 : 20) : 5;
  if (certo) {
    p.seq++;
    if (p.seq >= 3) ganho += 5;
    evento("acertos");
    if (p.modo === "revisao") evento("revisao");
    if (p.modo === "capitulo" && p.seq === 4) evento("sequencia");
    if (p.modo === "capitulo" && p.seq === 5) conquistar("seq5");
  } else p.seq = 0;
  p.comAjuda = false;
  p.xp += ganho; ganharXP(ganho);
  let nova = false;
  if (!S.cartas[c.ref]) { S.cartas[c.ref] = true; nova = true; p.novas.push(c.ref); evento("carta"); }
  if (Object.keys(S.cartas).length === refs.length) conquistar("colecao");
  salvar();
  const ultimo = p.i === p.casos.length - 1;
  document.getElementById("fb").innerHTML = `<div class="fb ${certo ? "ok" : "no"} enter">
    <h3>${certo ? (c.titulo ? "Decisão ética!" : "Resposta certa!") : "Não é bem assim."}</h3>
    <p>${esc(c.porque)}</p>
    <span class="ref">${esc(c.ref)}</span>
    <span class="xp-pop">+${ganho} XP${nova ? " · nova carta na Biblioteca" : ""}${!certo ? " · volta na Revisão de hoje" : agenda === "dominada" ? " · questão dominada" : agenda ? " · próxima revisão em " + formatarDia(agenda) : ""}</span>
    <button class="cta" id="prox">${ultimo ? "Ver resultado" : c.titulo ? "Próximo caso" : "Próxima questão"}</button></div>`;
  const pb = document.getElementById("prox"); pb.focus({ preventScroll: true });
  document.getElementById("fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
  pb.onclick = () => { if (ultimo) fim(); else { p.i++; caso(); window.scrollTo(0, 0); } };
}

function fim() {
  const p = partida;
  if (p.modo === "desafio") return fimDesafio(p.res, true);
  const total = p.casos.length, pct = p.acertos / total;
  const est = pct === 1 ? 3 : pct >= .75 ? 2 : pct >= .5 ? 1 : 0;
  if (p.modo === "revisao") { if (!pendentes().length) conquistar("revisor"); }
  else {
    const ant = S.caps[p.id];
    if (!ant || est > ant.estrelas) S.caps[p.id] = { estrelas: est };
    if (!ant) { ganharXP(30); p.xp += 30; }
    evento("capitulo");
    conquistar("primeiro");
    if (est === 3) { conquistar("perfeito"); if (p.id === "sigilo") conquistar("sigilo"); if (p.id === "conselhos") conquistar("conselhos"); }
    if (ESTUDO.every(c => S.caps[c.id])) conquistar("estudo");
    if (Object.keys(S.caps).length === CAPITULOS.length) conquistar("todos");
  }
  salvar(); enviarRanking();
  const msg = est === 3 ? "Atendimento impecável." : est === 2 ? "Muito bom. Quase lá." : est === 1 ? "Bom começo. Revise os erros." : "Hora de estudar o Código.";
  $app.innerHTML = `${topo()}<section class="result enter">
    <span class="label">${esc(p.nome)}</span>
    <span class="big">${p.acertos}/${total}</span>
    ${p.modo === "revisao" ? "" : estrelas(est)}
    <h2>${msg}</h2>
    <p class="xp-pop">+${p.xp} XP nesta rodada</p>
    ${p.novas.length ? `<div class="chips">${p.novas.map(r => `<span class="chip new">${esc(r)}</span>`).join("")}</div><p class="foot">Novas cartas na sua Biblioteca</p>` : ""}
    <div class="stack">
      ${pendentes().length ? `<button class="cta" id="rev">Revisar ${pendentes().length} agora</button>` : ""}
      <button class="cta ${pendentes().length ? "ghost" : ""}" id="volta">Voltar ao plantão</button>
    </div></section>`;
  tela = "fim";
  document.getElementById("volta").onclick = home;
  const r = document.getElementById("rev"); if (r) r.onclick = revisar;
}

/* ---------- Desafio do dia ---------- */
function fimDesafio(res, agora) {
  tela = "fim";
  if (agora) {
    S.desafio = { dia: hoje(), res };
    ganharXP(20); evento("desafio"); conquistar("desafio");
    if (res.every(Boolean)) conquistar("desafio5");
    salvar(); enviarRanking();
  }
  const n = res.filter(Boolean).length;
  $app.innerHTML = `${topo()}<section class="result enter">
    <span class="label">Desafio do dia · ${diaMes()}</span>
    <span class="big">${n}/5</span>
    ${quadrados(res).replace('class="sq"', 'class="sq big-sq"')}
    <h2>${n === 5 ? "Dia perfeito." : n >= 3 ? "Bom plantão." : "Amanhã tem outro."}</h2>
    <p class="foot">Um novo desafio aparece todo dia, igual para todo mundo.</p>
    <div class="stack">
      <button class="cta" id="comp">Copiar resultado para compartilhar</button>
      ${pendentes().length ? `<button class="cta ghost" id="rev">Fazer as ${pendentes().length} revisões de hoje</button>` : ""}
      <button class="cta ghost" id="volta">Voltar ao plantão</button>
    </div></section>`;
  document.getElementById("volta").onclick = home;
  const rv = document.getElementById("rev"); if (rv) rv.onclick = revisar;
  document.getElementById("comp").onclick = () => copiar(`Plantão Ético · Desafio de ${diaMes()}\n${res.map(r => r ? "🟩" : "🟥").join("")} ${n}/5\nSequência de estudo: ${streakAtual()} dia(s)`);
}

/* ---------- Simulado ---------- */
function fimProva() {
  tela = "fim";
  const p = partida, nota = p.acertos, xp = nota * 10;
  ganharXP(xp); evento("prova");
  const recorde = S.melhorProva == null || nota > S.melhorProva;
  if (recorde) S.melhorProva = nota;
  if (nota === 10) conquistar("nota10");
  salvar(); enviarRanking();
  $app.innerHTML = `${topo()}<section class="result enter">
    <span class="label">Simulado</span>
    <span class="big">${nota}<small>/10</small></span>
    <h2>${nota === 10 ? "Nota máxima." : nota >= 7 ? "Aprovado(a)." : "Ainda não. Revise e tente de novo."}</h2>
    <p class="xp-pop">+${xp} XP${recorde ? " · sua melhor nota" : ""}</p>
  </section>
  ${p.erradas.length ? `<div class="section-h"><h2>Correção</h2><span class="label">${p.erradas.length} erro(s) voltam na Revisão de hoje</span></div>
  <div class="stack">${p.erradas.map(({ c, o }) => `<div class="fb no">
    <h3>${esc(c.caso)}</h3>
    <p><span class="label">Sua resposta</span><br>${esc(c.opcoes[o])}</p>
    <p><span class="label">Resposta certa</span><br><strong>${esc(c.opcoes[c.certa])}</strong></p>
    <p>${esc(c.porque)}</p><span class="ref">${esc(c.ref)}</span></div>`).join("")}</div>` : ""}
  <div class="stack"><button class="cta" id="de">Novo simulado</button><button class="cta ghost" id="volta">Voltar ao plantão</button></div>`;
  document.getElementById("de").onclick = () => jogar({ modo: "prova", nome: "Simulado", casos: embaralhar(todosCasos.filter(c => c.trilha === "estudo")).slice(0, 10) });
  document.getElementById("volta").onclick = home;
  window.scrollTo(0, 0);
}

/* ---------- Relâmpago ---------- */
let tick = null;
function pararTimer() { if (tick) { clearInterval(tick); tick = null; } document.onkeydown = null; }
function relampago() {
  tela = "jogo"; marcarDia(); salvar();
  const r = { fila: embaralhar(RELAMPAGO), i: 0, pts: 0, combo: 0, maxCombo: 0, t: 60, acertos: 0, travado: false };
  $app.innerHTML = `<div class="bar-row"><button class="back" id="sair">Sair</button><span class="label" style="flex:1">Relâmpago</span><span class="label">Recorde ${S.melhorRel}</span></div>
  <div class="quick-head"><span class="timer" id="tm">60</span><span class="combo" id="cb">combo x1</span><span class="timer" id="pt" style="font-size:26px">0</span></div>
  <div class="statement" id="st"></div>
  <div class="yn"><button class="no" id="bn">Não pode</button><button class="yes" id="by">Pode</button></div>
  <p class="hint" id="hn">Responda o máximo que conseguir. Acertos seguidos multiplicam os pontos.</p>`;
  const st = document.getElementById("st"), hn = document.getElementById("hn");
  const mostrar = () => { if (r.i >= r.fila.length) { r.fila = r.fila.concat(embaralhar(RELAMPAGO)); } st.className = "statement"; st.textContent = r.fila[r.i].t; };
  const resp = v => {
    if (r.travado || r.t <= 0) return; r.travado = true;
    const q = r.fila[r.i], ok = q.pode === v;
    if (ok) { r.combo++; r.acertos++; r.maxCombo = Math.max(r.maxCombo, r.combo); r.pts += 10 * Math.min(1 + Math.floor(r.combo / 3), 5); }
    else r.combo = 0;
    st.className = "statement " + (ok ? "ok" : "no");
    hn.textContent = (ok ? "Certo. " : "Errado. ") + q.e;
    document.getElementById("pt").textContent = r.pts;
    document.getElementById("cb").textContent = "combo x" + Math.min(1 + Math.floor(r.combo / 3), 5);
    if (r.combo === 6) evento("combo");
    if (r.maxCombo >= 10) conquistar("combo10");
    setTimeout(() => { r.i++; r.travado = false; if (r.t > 0) mostrar(); }, ok ? 650 : 1500);
  };
  document.getElementById("bn").onclick = () => resp(false);
  document.getElementById("by").onclick = () => resp(true);
  document.getElementById("sair").onclick = home;
  document.onkeydown = e => { if (e.key === "ArrowLeft") resp(false); if (e.key === "ArrowRight") resp(true); };
  mostrar();
  tick = setInterval(() => {
    r.t--; const tm = document.getElementById("tm"); if (!tm) return pararTimer();
    tm.textContent = r.t; tm.classList.toggle("low", r.t <= 10);
    if (r.t <= 0) { pararTimer(); fimRelampago(r); }
  }, 1000);
}
function fimRelampago(r) {
  tela = "fim";
  const recorde = r.pts > S.melhorRel; if (recorde) S.melhorRel = r.pts;
  const xp = Math.round(r.pts / 5); ganharXP(xp);
  if (r.pts >= 200) conquistar("rel200");
  evento("relampago");
  salvar(); enviarRanking();
  $app.innerHTML = `${topo()}<section class="result enter">
    <span class="label">Relâmpago</span><span class="big">${r.pts}</span>
    <h2>${recorde ? "Novo recorde!" : "Fim do tempo."}</h2>
    <div class="chips"><span class="chip">${r.acertos} acertos</span><span class="chip">combo máximo ${r.maxCombo}</span><span class="chip new">+${xp} XP</span></div>
    <div class="stack"><button class="cta" id="de">Jogar de novo</button><button class="cta ghost" id="volta">Voltar ao plantão</button></div></section>`;
  document.getElementById("de").onclick = relampago;
  document.getElementById("volta").onclick = home;
}

/* ---------- Biblioteca e conquistas ---------- */
function biblioteca() {
  tela = "biblioteca";
  $app.innerHTML = `<div class="bar-row"><button class="back" id="sair">Voltar</button><span class="label">${Object.keys(S.cartas).length}/${refs.length} cartas</span></div>
  <div class="hero"><h1 style="font-size:32px">Biblioteca do Código</h1><p>Cada questão que você responde desbloqueia a carta do artigo que a fundamenta. Complete a coleção.</p></div>
  <div class="grid">${refs.map(([ref, resumo]) => S.cartas[ref]
    ? `<div class="card"><span class="ref">${esc(ref)}</span><p>${esc(resumo)}</p></div>`
    : `<div class="card locked"><span class="ref">${esc(ref)}</span><p>Responda uma questão para desbloquear.</p></div>`).join("")}</div>`;
  document.getElementById("sair").onclick = home;
}
function conquistas() {
  tela = "conquistas";
  $app.innerHTML = `<div class="bar-row"><button class="back" id="sair">Voltar</button><span class="label">${Object.keys(S.conquistas).length}/${CONQUISTAS.length}</span></div>
  <div class="hero"><h1 style="font-size:32px">Conquistas</h1><p>Medalhas por constância, acerto e curiosidade.</p></div>
  <div class="grid">${CONQUISTAS.map(c => `<div class="card ${S.conquistas[c.id] ? "got" : "locked"}"><span class="badge-ico">${c.ico}</span><strong>${esc(c.nome)}</strong><p>${esc(c.desc)}</p></div>`).join("")}</div>
  <button class="cta ghost" id="zerar">Apagar meu progresso</button>`;
  document.getElementById("sair").onclick = home;
  const z = document.getElementById("zerar");
  z.onclick = () => {
    if (z.dataset.confirm) { S = NOVO(); salvar(); home(); toast("Progresso apagado"); }
    else { z.dataset.confirm = "1"; z.textContent = "Toque de novo para confirmar"; }
  };
}

/* ---------- Ranking da turma (só para quem entra com conta Claude) ---------- */
let DB = null, USER = null, MEU_ID = null, rankSoLeitura = false, ultimoEnvio = "";
function enviarRanking() {
  if (!DB || !MEU_ID || rankSoLeitura) return;
  const d = { xp: S.xp, cartas: Object.keys(S.cartas).length, relampago: S.melhorRel };
  const k = JSON.stringify(d); if (k === ultimoEnvio) return; ultimoEnvio = k;
  DB.collection("ranking").doc(MEU_ID).set({ ...d, atualizado: Date.now() })
    .catch(e => { if (e && e.code === "invalid_argument") rankSoLeitura = true; });
}
async function ranking() {
  tela = "ranking";
  $app.innerHTML = `<div class="bar-row"><button class="back" id="sair">Voltar</button><span class="label">Top 30 por XP</span></div>
  <div class="hero"><h1 style="font-size:32px">Ranking</h1><p>Quem mais estudou o Código. Seu XP entra aqui quando você termina uma rodada.</p></div>
  <ol class="rank" id="rk"><li class="vazio">Carregando ranking…</li></ol>
  ${rankSoLeitura ? `<p class="foot">Você pode ver o ranking, mas para aparecer nele peça acesso de Contribuidor a quem compartilhou o jogo.</p>` : ""}`;
  document.getElementById("sair").onclick = home;
  try {
    const snap = await DB.collection("ranking").orderBy("xp", "desc").limit(30).get();
    const ids = snap.docs.map(d => d.id), ps = ids.length ? await USER.profiles(ids) : {};
    if (tela !== "ranking") return;
    document.getElementById("rk").innerHTML = snap.empty ? `<li class="vazio">Ninguém no ranking ainda. Termine uma rodada para ser o primeiro.</li>`
      : snap.docs.map((d, i) => { const v = d.data(), xp = Number(v.xp) || 0, nv = NIVEIS.reduce((a, l, j) => xp >= l.xp ? j : a, 0);
        return `<li class="${d.id === MEU_ID ? "me" : ""}"><span class="pos">${i + 1}</span>
          <span class="nm">${esc((ps[d.id] && ps[d.id].name) || "Participante")}${d.id === MEU_ID ? " (você)" : ""}<small>${NIVEIS[nv].nome} · ${Number(v.cartas) || 0} cartas</small></span>
          <span class="pts">${xp} XP</span></li>`; }).join("");
  } catch (e) {
    if (tela === "ranking") document.getElementById("rk").innerHTML = `<li class="vazio">Não foi possível carregar o ranking agora. Tente de novo mais tarde.</li>`;
  }
}

function copiar(txt) {
  const ok = () => toast("Copiado. É só colar no WhatsApp ou nos stories.");
  try { navigator.clipboard.writeText(txt).then(ok, () => toast(txt)); } catch (e) { toast(txt); }
}
function compartilhar() {
  copiar(`Estou no nível "${NIVEIS[nivel()].nome}" no Plantão Ético, com ${S.xp} XP, ${Object.keys(S.cartas).length}/${refs.length} cartas do Código de Ética e recorde de ${S.melhorRel} no Relâmpago. Bora jogar?`);
}

home();

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    DB = db; USER = user; MEU_ID = id;
    if ((await user.can("data.write")) === false) rankSoLeitura = true;
    enviarRanking();
    if (tela === "home") home();
  } catch (e) {}
})();
</script>
