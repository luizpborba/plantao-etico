<style>
/* Layout: um "celular" de até 480px. Cenário ilustrado ocupa a tela, personagens em pé no palco, caixa de diálogo por cima da parte de baixo.
   Visual de um mundo só (ilustração clara), por escolha: as cores são fixas e não seguem o tema escuro. */
:root {
  color-scheme: light;
  --ink: #1b2422;
  --paper: #fffdf8;
  --teal: #0f5f58;
  --teal-2: #4fb8ad;
  --gold: #f4c04a;
  --gold-ink: #3a2a00;
  --ok: #1f7a4d;
  --ok-bg: #dff3e7;
  --bad: #b53a26;
  --bad-bg: #fbe4df;
  --muted: #5b6b66;
  --night: #0e1f1c;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { position: relative; max-width: 480px; height: 100%; margin: 0 auto; overflow: hidden; background: #cfe3d8; }
@media (min-width: 520px) { #app { height: calc(100% - 32px); margin-top: 16px; border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.45); } }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.08; text-wrap: balance; }
p { margin: 0; }
.label { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }

/* ---------- cenário ---------- */
.fundo, .fundo .camada { position: absolute; inset: 0; }
.fundo .camada { transition: opacity .6s ease; }
.fundo svg { width: 100%; height: 100%; display: block; }
.nuvens { animation: nuvem 26s ease-in-out infinite alternate; }
@keyframes nuvem { to { transform: translateX(34px); } }
.planta { transform-box: fill-box; transform-origin: 50% 100%; animation: balanca 5s ease-in-out infinite; }
@keyframes balanca { 50% { transform: rotate(3deg); } }
.ponteiro { transform-box: fill-box; transform-origin: 50% 100%; animation: gira 40s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.lampada { transform-box: fill-box; transform-origin: 50% 0; animation: pendulo 4s ease-in-out infinite; }
@keyframes pendulo { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.holofote { transform-box: fill-box; transform-origin: 50% 0; animation: varre 7s ease-in-out infinite; }
@keyframes varre { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
.luz { animation: brilha 1.6s ease-in-out infinite alternate; }
.pisca { animation: brilha .8s steps(2, jump-none) infinite alternate; }
.ecg { stroke-dasharray: 260; animation: ecg 2.2s linear infinite; }
@keyframes ecg { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }
.tela-call { animation: brilha 3s ease-in-out infinite alternate; }
@keyframes brilha { from { opacity: .35; } to { opacity: 1; } }
.vapor { animation: vapor 3s ease-in-out infinite; }
@keyframes vapor { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateY(-14px); } }

/* ---------- personagens ---------- */
.palco { position: absolute; inset: 0; pointer-events: none; container-type: size; }
.slot { position: absolute; bottom: 21%; width: 60%; max-width: 290px; transition: left .5s ease, right .5s ease, bottom .5s ease, width .5s ease, transform .5s ease; }
/* nas escolhas, a caixa cresce: o personagem sobe para baixo do topo, num tamanho que caiba acima dela (a figura tem proporção 2:3) */
.palco.escolhendo .slot { width: min(40cqw, calc((44cqh - 60px) / 1.5)); bottom: calc(100cqh - 56px - min(60cqw, 44cqh - 60px)); }
.palco.escolhendo.so-esq .slot.esq { left: 50%; transform: translateX(-50%); }
.palco.escolhendo.so-dir .slot.dir { right: 50%; transform: translateX(50%); }
.palco-titulo .slot { bottom: 50%; width: 46%; }
.palco-titulo.so-esq .slot.esq { left: 2%; }
.slot.esq { left: -6%; }
.slot.dir { right: -6%; }
.palco.so-esq .slot.esq { left: 20%; }
.palco.so-dir .slot.dir { right: 20%; }
.char { transition: opacity .45s ease, transform .45s ease, filter .3s ease; }
.char.entra-esq { opacity: 0; transform: translateX(-50px); }
.char.entra-dir { opacity: 0; transform: translateX(50px); }
.char.ouvindo { filter: brightness(.82) saturate(.85); }
.slot.fala-agora { z-index: 2; }
.av { width: 100%; height: auto; display: block; overflow: visible; }
.av .corpo { transform-origin: 100px 300px; animation: respira 4s ease-in-out infinite; }
@keyframes respira { 50% { transform: scaleY(1.014) translateY(-1px); } }
.av .olhos { transform-origin: 100px 126px; animation: pisca 5s infinite; }
@keyframes pisca { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
.char.falando .boca { transform-origin: 100px 157px; animation: fala .15s ease-in-out infinite alternate; }
@keyframes fala { to { transform: scale(.92, 1.65); } }
.char.pula { animation: pula .55s ease; }
@keyframes pula { 30% { transform: translateY(-18px); } 60% { transform: translateY(0); } 80% { transform: translateY(-6px); } }
.char.treme { animation: treme .45s ease; }
@keyframes treme { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.char.afunda { animation: afunda .9s ease; }
@keyframes afunda { 40% { transform: translateY(10px) scale(.98); } }
.char.inclina { animation: inclina .8s ease; }
@keyframes inclina { 40% { transform: rotate(-3deg); } }

/* ---------- HUD ---------- */
.hud { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pill { background: rgba(255,253,248,.92); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 12px; font-family: var(--font-display); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pill.dia { flex: 1 1 auto; max-width: fit-content; }
.hud .dir-hud { display: flex; gap: 6px; flex: none; }
.pill.selos svg { width: 14px; height: 14px; fill: var(--gold); stroke: var(--ink); stroke-width: 1.5; }
.pill.selos.ganhou { animation: ganhou .6s ease; }
@keyframes ganhou { 40% { transform: scale(1.25); background: var(--gold); } }
.som-titulo { position: absolute; z-index: 22; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); color: var(--ink); }
.menu-btn { color: var(--ink); width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: rgba(255,253,248,.92); display: grid; place-items: center; font-weight: 700; }

/* ---------- caixa de diálogo ---------- */
.caixa { position: absolute; z-index: 6; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); min-height: 132px; }
.caixa.narra { background: #22312d; color: #f2efe6; border-color: #0b1513; box-shadow: 0 6px 0 #0b1513; }
.caixa.narra .fala { font-style: italic; }
.caixa .tag { position: absolute; top: -22px; left: 14px; display: flex; align-items: center; gap: 8px; background: var(--teal); color: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 3px 12px 3px 4px; animation: tag .3s ease; }
.caixa .tag.voce { background: var(--gold); color: var(--gold-ink); }
@keyframes tag { from { transform: translateY(8px); opacity: 0; } }
.caixa .tag b { font-family: var(--font-display); font-size: 16px; line-height: 1; }
.caixa .tag small { display: block; font-size: 11px; opacity: .85; line-height: 1.1; }
.mini { width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); overflow: hidden; display: block; flex: none; }
.mini svg { width: 100%; height: 100%; display: block; }
.conteudo { padding: 38px 20px 22px; max-height: 58vh; overflow-y: auto; }
.caixa.com-opcoes .conteudo { max-height: 54vh; }
@media (max-height: 720px) {
  .conteudo { padding: 32px 16px 16px; }
  .fala { font-size: 16px; line-height: 1.5; }
  .op { font-size: 14px; padding: 8px 10px; }
  .opcoes { gap: 7px; margin-top: 10px; }
  .nivel { margin-bottom: 6px; }
}
.caixa.narra .conteudo { padding-top: 22px; }
.fala { font-size: 17px; line-height: 1.6; min-height: 3.2em; white-space: pre-wrap; }
.nivel { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; padding: 3px 10px; border: 2px solid var(--ink); border-radius: 999px; font-family: var(--font-display); font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); animation: tag .3s ease; }
.nivel i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; }
.nivel i.on { background: var(--ink); }
.nivel.n1 { background: #dff3e7; }
.nivel.n2 { background: #fff1c9; }
.nivel.n3 { background: #fbe4df; }
/* resultado da prova do CRP */
.prova-res { text-align: center; align-items: center; }
.nota-grande { font-family: var(--font-display); font-weight: 800; font-size: 76px; line-height: 1; color: var(--gold); text-shadow: 0 5px 0 var(--ink); }
.tabela-niveis { width: 100%; max-width: 340px; border-collapse: collapse; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; font-variant-numeric: tabular-nums; }
.tabela-niveis th, .tabela-niveis td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #d9dfdc; font-size: 15px; }
.tabela-niveis tr:last-child td { border-bottom: 0; font-weight: 700; }
.tabela-niveis td:last-child, .tabela-niveis th:last-child { text-align: right; }
.carimbo { max-width: 90%; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .08em; padding: 6px 18px; border: 4px solid currentColor; border-radius: 10px; transform: rotate(-8deg); animation: carimbo .5s .4s cubic-bezier(.2,1.6,.4,1) both; }
.carimbo.ok { color: #5fd39a; }
.carimbo.no { color: #ff8a73; }
@keyframes carimbo { from { opacity: 0; transform: rotate(-8deg) scale(2.4); } }
.carteira { width: min(320px, 100%); display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; text-align: left; background: linear-gradient(135deg, #0f5f58, #1f8a7f); color: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 14px; box-shadow: 0 6px 0 var(--ink); animation: vira .8s .6s cubic-bezier(.2,1.2,.4,1) both; }
.carteira .foto { width: 76px; height: 76px; border-radius: 12px; background: #fff; border: 2px solid var(--ink); overflow: hidden; }
.carteira .foto svg { width: 100%; height: 100%; display: block; }
.carteira b { font-family: var(--font-display); font-size: 20px; display: block; overflow-wrap: anywhere; }
.carteira .num { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--gold); }
.crp-num { font-family: var(--font-display); font-weight: 800; color: var(--teal); }
.seta { position: absolute; right: 16px; bottom: 10px; font-size: 14px; animation: seta .8s ease-in-out infinite alternate; }
@keyframes seta { to { transform: translateY(4px); } }
.opcoes { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.op { text-align: left; background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 15px; display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; box-shadow: 0 3px 0 var(--ink); animation: opcao .35s ease both; transition: transform .1s; }
.op:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.op .k { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-size: 13px; }
.op.certa { background: var(--ok-bg); border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); }
.op.certa .k { background: var(--ok); }
.op.errada { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 3px 0 var(--bad); animation: treme .4s ease; }
.op.errada .k { background: var(--bad); }
.op.apaga { opacity: .35; }
@keyframes opcao { from { opacity: 0; transform: translateY(12px); } }

/* ---------- efeitos ---------- */
.flash { position: absolute; inset: 0; z-index: 4; pointer-events: none; animation: flash .7s ease forwards; }
.flash.ok { background: radial-gradient(circle at 50% 45%, rgba(95,211,154,.55), transparent 70%); }
.flash.no { background: radial-gradient(circle at 50% 45%, rgba(255,120,95,.45), transparent 70%); }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.flutua { position: absolute; z-index: 7; left: 50%; top: 38%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 800; font-size: 26px; padding: 6px 16px; border-radius: 999px; border: 3px solid var(--ink); pointer-events: none; animation: flutua 1.4s ease forwards; white-space: nowrap; }
.flutua.ok { background: var(--gold); color: var(--gold-ink); }
.flutua.no { background: #fff; color: var(--bad); }
@keyframes flutua { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.8); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 70% { opacity: 1; transform: translate(-50%, -30px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60px); } }

/* ---------- telas sobrepostas ---------- */
.overlay { position: absolute; inset: 0; z-index: 20; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 16px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: aparece .35s ease; }
@keyframes aparece { from { opacity: 0; } }
.overlay.escuro { background: rgba(14,31,28,.86); color: #f2efe6; backdrop-filter: blur(3px); }
.overlay.papel { background: var(--paper); }
.btn { border: 3px solid var(--ink); background: var(--gold); color: var(--gold-ink); border-radius: 14px; padding: 13px 16px; font-family: var(--font-display); font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 var(--ink); width: 100%; text-align: center; text-decoration: none; display: block; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.sec { background: #fff; color: var(--ink); }
.btn.teal { background: var(--teal); color: #fff; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.toque { text-align: center; font-size: 14px; opacity: .8; animation: seta .9s ease-in-out infinite alternate; }

/* título */
.titulo { background: linear-gradient(180deg, transparent 0%, transparent 36%, rgba(14,31,28,.94) 56%); color: #fff; justify-content: flex-end; }
.titulo .psi { width: 64px; height: 64px; border-radius: 18px; background: var(--gold); color: var(--ink); border: 3px solid var(--ink); display: grid; place-items: center; font-family: Georgia, serif; font-size: 38px; box-shadow: 0 4px 0 var(--ink); animation: pula 1.6s ease infinite; }
.titulo h1 { font-size: clamp(40px, 12vw, 56px); font-weight: 800; letter-spacing: -.02em; }
.titulo h1 span { color: var(--gold); }
.titulo p.sub { font-size: 17px; opacity: .9; }
.balao { position: absolute; top: 12%; right: 6%; max-width: 48%; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 14px; font-weight: 700; z-index: 21; animation: balao 3s ease-in-out infinite; }
.balao::after { content: ""; position: absolute; left: 20px; bottom: -14px; border: 8px solid transparent; border-top-color: var(--ink); }
@keyframes balao { 50% { transform: translateY(-6px); } }
.pilha { display: flex; flex-direction: column; gap: 10px; }
.nota { font-size: 13px; opacity: .75; text-align: center; }
.nota a { color: inherit; }

/* criar personagem */
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo input { font: inherit; font-size: 18px; border: 3px solid var(--ink); border-radius: 12px; padding: 12px 14px; background: #fff; color: var(--ink); }
.looks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.look { border: 3px solid var(--ink); border-radius: 16px; background: #fff; padding: 8px 6px 0; overflow: hidden; box-shadow: 0 4px 0 var(--ink); }
.look[aria-pressed="true"] { background: var(--gold); transform: translateY(-4px); }
.look svg { width: 100%; height: auto; display: block; }

/* cartaz do dia */
.cartaz { background: var(--teal); color: #fff; justify-content: center; text-align: center; align-items: center; cursor: pointer; }
.cartaz .semana { animation: desce .5s ease both; }
.cartaz .num { font-family: var(--font-display); font-weight: 800; font-size: 88px; line-height: 1; color: var(--gold); text-shadow: 0 5px 0 var(--ink); animation: zoom .6s .15s cubic-bezier(.2,1.6,.4,1) both; }
.cartaz h2 { font-size: 34px; animation: desce .5s .35s ease both; }
.cartaz p { opacity: .9; animation: desce .5s .5s ease both; max-width: 30ch; }
@keyframes desce { from { opacity: 0; transform: translateY(-14px); } }
@keyframes zoom { from { opacity: 0; transform: scale(.3); } }

/* carta do código */
.carta-wrap { justify-content: center; align-items: center; text-align: center; cursor: pointer; }
.carta { width: min(300px, 100%); background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 20px; padding: 22px 20px; box-shadow: 0 8px 0 var(--ink), 0 0 60px rgba(244,192,74,.6); display: flex; flex-direction: column; gap: 12px; animation: vira .8s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes vira { from { transform: perspective(700px) rotateY(100deg) scale(.6); opacity: 0; } }
.carta .ref { align-self: center; background: var(--gold); color: var(--gold-ink); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 14px; font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.carta .psi-c { font-family: Georgia, serif; font-size: 34px; color: var(--teal); }
.brilho { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: brilho 1.2s ease-out forwards; }
@keyframes brilho { to { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; } }

/* fim do dia, agenda, caderno */
.cab { display: flex; align-items: center; gap: 12px; }
.cab .mini { width: 52px; height: 52px; }
.cab h2 { font-size: 24px; }
.estrelas { display: flex; gap: 6px; justify-content: center; }
.estrelas svg { flex: none; width: 54px; height: 54px; fill: rgba(255,255,255,.2); stroke: var(--ink); stroke-width: 1.5; }
.estrelas svg.on { fill: var(--gold); animation: zoom .5s cubic-bezier(.2,1.6,.4,1) both; }
.estrelas.peq svg { width: 18px; height: 18px; }
.estrelas.peq svg.on { animation: none; }
.resumo-dia { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.resumo-dia .grande { font-family: var(--font-display); font-weight: 800; font-size: 44px; }
.anot { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.anot h3 { font-size: 18px; }
.anot ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }
.anot b { color: var(--teal); }
.semana-h { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
.semana-h h3 { font-size: 20px; }
.dias { display: flex; flex-direction: column; gap: 10px; }
.dia-card { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 12px; box-shadow: 0 4px 0 var(--ink); }
.dia-card .cal { width: 54px; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; text-align: center; background: #fff; }
.dia-card .cal span { display: block; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 2px 0; }
.dia-card .cal b { display: block; font-family: var(--font-display); font-size: 24px; padding: 2px 0; }
.dia-card strong { font-family: var(--font-display); font-size: 17px; display: block; }
.dia-card small { color: var(--muted); font-size: 13px; }
.dia-card[disabled] { opacity: .5; box-shadow: none; }
.dia-card.feito .cal span { background: var(--ok); }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.cartinha { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cartinha .ref { align-self: flex-start; background: var(--gold); border: 2px solid var(--ink); border-radius: 8px; padding: 2px 8px; font-family: var(--font-display); font-weight: 800; font-size: 13px; }
.cartinha p { font-size: 14px; }
.cartinha.bloq { background: transparent; border-style: dashed; color: var(--muted); }
.cartinha.bloq .ref { background: #e6ebe8; color: var(--muted); }
.certificado { background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; padding: 26px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; box-shadow: 0 6px 0 var(--ink); outline: 3px double var(--gold); outline-offset: -12px; }
.certificado .psi-c { font-family: Georgia, serif; font-size: 40px; color: var(--teal); }
.certificado h2 { font-size: 26px; }
.certificado .nome { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--teal); border-bottom: 2px solid var(--ink); padding: 0 12px 4px; overflow-wrap: anywhere; }
.assin { display: flex; gap: 20px; justify-content: center; font-size: 13px; color: var(--muted); }
.assin span { border-top: 1px solid var(--ink); padding-top: 4px; }
.toast { position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 40; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700; transition: .3s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
canvas.confete { position: absolute; inset: 0; z-index: 30; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {

let sacoCerta = [], ultimaCerta = -1;
function posicaoCerta(n) {
  let disp = sacoCerta.filter(i => i < n && i !== ultimaCerta);
  if (!disp.length) { sacoCerta = embaralhar([0, 1, 2, 3]); disp = sacoCerta.filter(i => i < n && i !== ultimaCerta); }
  const p = disp[0];

  ultimaCerta = p;

}

function executar(p) {

  if (p.sai) { tirar(p.sai); avancar(); return; }

/* palco: Helena e Marcos (quando a Helena não está) ficam à esquerda; os demais à direita */
function lado(f) {
  if (palco.esq === f) return "esq";
  if (palco.dir === f) return "dir";

function atualizaLayout() {

function colocar(f, emo) {

    if (ch) { const velho = ch; velho.classList.add("entra-" + l); depois(() => velho.remove(), 450); }
    palco[l] = f;
    ch = document.createElement("div");
    ch.className = "char entra-" + l; ch.dataset.f = f; ch.dataset.e = emo;
    ch.innerHTML = avatar(PERS[f], emo);
    ch.querySelector(".olhos").style.animationDelay = `-${(Math.random() * 4).toFixed(2)}s`;
    slot.appendChild(ch);
    requestAnimationFrame(() => requestAnimationFrame(() => ch.classList.remove("entra-" + l)));
    Som.pop();
    atualizaLayout();
    return;
  }
  if (ch.dataset.e !== emo) {
    ch.dataset.e = emo; ch.innerHTML = avatar(PERS[f], emo);
    const a = EMO[emo] && EMO[emo].anim;
    if (a === "pula") Som.boing(); else if (a === "treme") Som.tremor();
    if (a) { ch.classList.remove("pula", "treme", "afunda", "inclina"); void ch.offsetWidth; ch.classList.add(a); ch.addEventListener("animationend", () => ch.classList.remove(a), { once: true }); }
  }
}

function falar(p, aoTerminar) {
  const f = p.f || "narr";

    tag.hidden = false; tag.classList.toggle("voce", f === "voce");
    tag.style.animation = "none"; void tag.offsetWidth; tag.style.animation = "";

function escrever(texto, f, aoTerminar) {
  const el = document.getElementById("fala"), seta = document.getElementById("seta");
  const ch = document.querySelector(`.char[data-f="${f}"]`);
  seta.hidden = true; el.textContent = "";
  if (ch) ch.classList.add("falando");
  let k = 0;
  const terminar = () => {
    clearInterval(id); digitando = null; el.textContent = texto;
    if (ch) ch.classList.remove("falando");
    if (aoTerminar) aoTerminar(); else seta.hidden = false;
  };
  const id = setInterval(() => { k += 2; if (k % 6 === 0) Som.voz(f); el.textContent = texto.slice(0, k); if (k >= texto.length) terminar(); }, 28);
  digitando = { id, fim: terminar };
  if (SEM_MOVIMENTO) terminar();
}

function perguntar(q) {
  esperando = true;

function mostrarOpcoes(q) {

function escolher(q, op, btn) {
  esperando = false; travado = true;
  document.getElementById("palco").classList.remove("escolhendo");
  document.getElementById("caixa").classList.remove("com-opcoes");
  document.querySelectorAll(".op").forEach(b => { b.disabled = true; if (b !== btn) b.classList.add("apaga"); });
  btn.classList.add(op.ok ? "certa" : "errada");
  const peso = q.nivel || 1;
  if (q.prova) {
    prova.max += peso; prova.porNivel[peso][1]++;
    if (op.ok) { prova.pontos += peso; prova.porNivel[peso][0]++; }
  } else {
    placar.total++; placar.max += peso;
    if (op.ok) { placar.acertos++; placar.pontos += peso; }
  }
  if (op.ok) Som.acerto(); else Som.erro();
  document.getElementById("n-selos").textContent = placar.pontos;
  if (op.ok) { const s = document.getElementById("selos"); s.classList.remove("ganhou"); void s.offsetWidth; s.classList.add("ganhou"); }
  const fl = document.createElement("div"); fl.className = "flash " + (op.ok ? "ok" : "no"); $app.appendChild(fl); depois(() => fl.remove(), 800);
  const tx = document.createElement("div"); tx.className = "flutua " + (op.ok ? "ok" : "no"); tx.textContent = op.ok ? `+${peso} ${peso === 1 ? "ponto" : "pontos"}` : "Repense"; $app.appendChild(tx); depois(() => tx.remove(), 1500);
  fila.splice(pos + 1, 0, ...op.r, ...q.ensina, ...(q.carta ? [{ carta: q.carta }] : []));
  depois(() => { travado = false; avancar(); }, 1000);
}

function mostrarCarta(ref) {
  placar.cartas.push(ref);
  if (G.cartas[ref]) { avancar(); return; }
  G.cartas[ref] = true; salvar(); Som.carta();
  const div = document.createElement("div");
  div.className = "overlay escuro carta-wrap";
  div.innerHTML = `<span class="label">Nova carta do Código</span>
    <div class="carta"><span class="psi-c">Ψ</span><span class="ref">${esc(ref)}</span><p>${esc(CARTAS[ref])}</p></div>
    <p class="nota">Guardada no seu Caderno · ${Object.keys(G.cartas).length} de ${totalCartas}</p><p class="toque">Toque para continuar</p>`;
  $app.appendChild(div);
  if (!SEM_MOVIMENTO) for (let i = 0; i < 18; i++) {
    const s = document.createElement("span"); s.className = "brilho";
    const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 90;
    s.style.left = "50%"; s.style.top = "45%"; s.style.setProperty("--x", Math.cos(a) * d + "px"); s.style.setProperty("--y", Math.sin(a) * d + "px");
    div.appendChild(s);
  }
  const ir = () => { div.remove(); avancar(); };
  div.onclick = ir; div.tabIndex = 0; div.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ir(); } }; div.focus();
}

function resultadoProva() {
  const nota = nota10(prova.pontos, prova.max), passou = nota >= NOTA_CRP;
  if (passou && !G.crp) G.crp = "CRP 00/" + String(Math.floor(10000 + Math.random() * 90000));
  G.melhorNota = Math.max(G.melhorNota || 0, nota); salvar();
  if (passou) { confete(); Som.fanfarra(); } else Som.triste();
  const linhas = [1, 2, 3].map(n => { const [a, t] = prova.porNivel[n]; return `<tr><td>${NIVEIS[n]}</td><td>${a} de ${t}</td><td>× ${n}</td><td>${a * n} de ${t * n}</td></tr>`; }).join("");
  const div = document.createElement("div");
  div.className = "overlay escuro prova-res";
  div.innerHTML = `<span class="label">Prova do CRP</span>
    <span class="nota-grande" id="nota-anim">0,0</span>
    <span>média ponderada · mínimo ${NOTA_CRP}</span>
    <table class="tabela-niveis"><thead><tr><th>Nível</th><th>Acertos</th><th>Peso</th><th>Pontos</th></tr></thead>
      <tbody>${linhas}<tr><td>Total</td><td></td><td></td><td>${prova.pontos} de ${prova.max}</td></tr></tbody></table>
    <span class="carimbo ${passou ? "ok" : "no"}">${passou ? "APROVADO" : "NÃO FOI DESTA VEZ"}</span>
    ${passou ? `<div class="carteira"><span class="foto">${cabecaSVG(eu(), "feliz")}</span><span><span class="label">Carteira profissional</span><b>${esc(G.nome)}</b><span class="num">${esc(G.crp)}</span></span></div>` : `<p>${nota >= 5 ? "Faltou pouco." : "Ainda não."} Revise as explicações do Marcos e tente de novo: as perguntas mudam a cada prova.</p>`}
    <div class="pilha" style="width:100%">
      ${passou ? `<button class="btn" id="seguir">Receber meu registro</button>` : `<button class="btn" id="refazer">Refazer a prova</button>
      <a class="btn sec" href="${LINK_TREINO}" target="_blank" rel="noopener">Estudar no modo treino</a>
      <button class="btn sec" id="ag">Sair para a agenda</button>`}
    </div>`;
  $app.appendChild(div);
  const el = div.querySelector("#nota-anim"), t0 = performance.now();
  (function conta(t) { const k = Math.min((t - t0) / 1200, 1); el.textContent = fmtNota(nota * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(conta); })(t0);
  if (passou) div.querySelector("#seguir").onclick = () => { div.remove(); avancar(); };
  else {
    div.querySelector("#refazer").onclick = () => { div.remove(); fila.splice(pos + 1, 0, { prova: true }); avancar(); };
    div.querySelector("#ag").onclick = telaAgenda;
  }
}

function fimDoDia() {
  const pct = placar.max ? placar.pontos / placar.max : 0;
  const est = pct >= .9 ? 3 : pct >= .65 ? 2 : pct >= .4 ? 1 : 0;
  const ant = G.dias[D.id];
  G.dias[D.id] = { estrelas: Math.max(est, ant ? ant.estrelas : 0) };
  salvar();
  const ultimo = D.indice === DIAS.length - 1;
  const refs = [...new Set(placar.cartas)];
  const div = document.createElement("div");
  div.className = "overlay escuro";
  div.innerHTML = `<div class="resumo-dia">
      <span class="label">Fim do dia ${D.indice + 1}</span>
      <h2 style="font-size:32px">${D.indice === 4 ? "Primeira semana concluída!" : est === 3 ? "Plantão impecável!" : est === 2 ? "Muito bom!" : est === 1 ? "Bom começo." : "Dia difícil. Tente de novo?"}</h2>
      ${estrelas(est)}
      <span class="grande">${fmtNota(nota10(placar.pontos, placar.max))}</span><span>nota do dia · ${placar.pontos} de ${placar.max} pontos · ${placar.acertos} de ${placar.total} decisões certas</span>
    </div>
    <div class="anot"><h3>Anotações da Helena</h3><ul>${refs.map(r => `<li><b>${esc(r)}:</b> ${esc(CARTAS[r])}</li>`).join("")}</ul></div>
    <div class="pilha">
      ${ultimo ? `<button class="btn" id="cert">Receber certificado</button>` : `<button class="btn" id="prox">Próximo dia</button>`}
      <button class="btn sec" id="rep">Rejogar este dia</button>
      <button class="btn sec" id="ag">Agenda da semana</button>
    </div>`;
  $app.appendChild(div);
  if (est >= 2) { confete(); Som.fanfarra(); } else Som.triste();
  const p = div.querySelector("#prox"); if (p) p.onclick = () => iniciarDia(D.indice + 1);
  const c = div.querySelector("#cert"); if (c) c.onclick = certificado;
  div.querySelector("#rep").onclick = () => iniciarDia(D.indice);
  div.querySelector("#ag").onclick = telaAgenda;
}

function pausa() {
  if (document.querySelector(".overlay")) return;
  const div = document.createElement("div");
  div.className = "overlay escuro";
  div.style.justifyContent = "center";
  div.innerHTML = `<h2 style="font-size:30px;text-align:center">Pausa</h2>
    <div class="pilha"><button class="btn" id="seguir">Continuar</button>
    <button class="btn sec" id="t-som" aria-pressed="${G.som}">Efeitos e vozes: ${G.som ? "ligados" : "desligados"}</button>
    <button class="btn sec" id="t-mus" aria-pressed="${G.musica}">Música: ${G.musica ? "ligada" : "desligada"}</button>
    <button class="btn sec" id="cad">Caderno do Código</button>
    <button class="btn sec" id="rei">Recomeçar o dia</button><button class="btn sec" id="ag">Sair para a agenda</button></div>`;
  $app.appendChild(div);
  div.querySelector("#seguir").onclick = () => { div.remove(); document.getElementById("som").innerHTML = ICO_SOM(somLigado()); };
  div.querySelector("#t-som").onclick = e => { G.som = !G.som; salvar(); e.currentTarget.textContent = "Efeitos e vozes: " + (G.som ? "ligados" : "desligados"); e.currentTarget.setAttribute("aria-pressed", G.som); };
  div.querySelector("#t-mus").onclick = e => { G.musica = !G.musica; salvar(); if (G.musica) Som.iniciar(); else Som.pararMusica(); e.currentTarget.textContent = "Música: " + (G.musica ? "ligada" : "desligada"); e.currentTarget.setAttribute("aria-pressed", G.musica); };
  div.querySelector("#cad").onclick = () => { div.remove(); telaCaderno(); };
  div.querySelector("#rei").onclick = () => iniciarDia(D.indice);
  div.querySelector("#ag").onclick = telaAgenda;
  div.querySelector("#seguir").focus();
}

function confete() {
  if (SEM_MOVIMENTO) return;
  const cv = document.createElement("canvas"); cv.className = "confete";
  const r = $app.getBoundingClientRect(); cv.width = r.width; cv.height = r.height;
  $app.appendChild(cv);
  const ctx = cv.getContext("2d"), cores = ["#f4c04a", "#4fb8ad", "#e07fa5", "#7a5bd1", "#ffffff", "#5fd39a"];
  const ps = Array.from({ length: 140 }, () => ({ x: cv.width / 2, y: cv.height * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, c: cores[Math.floor(Math.random() * cores.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  const t0 = performance.now();
  (function quadro(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(quadro); else cv.remove();
  })(t0);
}

telaTitulo();
</script>

</body>
